name: pi-mdtools-parity

# Consumer-side compatibility CI for the binary-owned contract (ADR 0003).
# pi-mdtools is a pure projection of the mdtools `md` binary; this proves the
# projection still holds against the producer. Two legs are intended:
#   - latest-master canary (wired below): catch producer drift early.
#   - declared-compatible release: TODO once mdtools cuts its first tag — add a
#     matrix entry pinning `ref:` to that tag so a known-good pairing is proven
#     alongside the moving canary.

on:
  push:
    paths:
      - "packages/pi-mdtools/**"
      - ".github/workflows/pi-mdtools-parity.yml"
  pull_request:
    paths:
      - "packages/pi-mdtools/**"
      - ".github/workflows/pi-mdtools-parity.yml"

permissions:
  contents: read

concurrency:
  group: pi-mdtools-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pi-rov
        uses: actions/checkout@v4

      - name: Check out mdtools (latest master canary)
        uses: actions/checkout@v4
        with:
          repository: pro-vi/mdtools
          ref: master
          path: mdtools

      - name: Install stable Rust toolchain
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Build the md binary
        working-directory: mdtools
        run: cargo build --release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace
        run: npm install

      - name: Typecheck + unit tests
        working-directory: packages/pi-mdtools
        run: |
          npm run typecheck
          npm test

      - name: Parity against latest-master md
        working-directory: packages/pi-mdtools
        run: MD_BINARY="$GITHUB_WORKSPACE/mdtools/target/release/md" npm test
